services:
  db:
    image: postgres:16-alpine
    container_name: sina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sina
      POSTGRES_PASSWORD: sina_secret
      POSTGRES_DB: sina_ia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sina -d sina_ia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

