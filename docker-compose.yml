services:
  # -------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: sina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sina
      POSTGRES_PASSWORD: sina_secret
      POSTGRES_DB: sina_ia
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sina -d sina_ia"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Backend FastAPI (Processamento de documentos, OCR, TTS)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend/app
      dockerfile: Dockerfile
    container_name: sina_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Chaves e modelos de IA vêm do .env da raiz (veja .env.example)
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://sina:sina_secret@db:5432/sina_ia
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no .env da raiz (veja .env.example)}
      - LLM_KEY_ENCRYPTION_SECRET=${LLM_KEY_ENCRYPTION_SECRET:?Defina LLM_KEY_ENCRYPTION_SECRET no .env da raiz (veja .env.example)}
      - UPLOAD_DIR=/app/data/uploads
      - OUTPUT_DIR=/app/data/outputs
      - PIPER_URL=http://piper:5000
    volumes:
      # Uploads e áudios MP3 persistem em ./data na sua máquina
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      piper:
        condition: service_started

  # -------------------------------------------------------------
  # Voz local (Piper, GPL-3.0, isolado neste container; ADR-0004)
  # -------------------------------------------------------------
  piper:
    build:
      context: ./piper
      dockerfile: Dockerfile
    container_name: sina_piper
    restart: unless-stopped

  # -------------------------------------------------------------
  # 3. Frontend Next.js (Interface Web e Acessibilidade)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sina_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
