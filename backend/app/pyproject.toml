[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "Nicholas",email = "nicholasnas.nn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.141.1)",
    "pillow (>=12.3.0,<13.0.0)",
    "edge-tts (>=7.2.8,<8.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "opencv-python-headless (>=5.0.0.93,<6.0.0.0)",
    "google-genai (>=0.1.1)",
    "aiofiles (>=23.2.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0.0)",
    "pytest-asyncio (>=0.23.0)",
    "httpx (>=0.27.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["app"]



