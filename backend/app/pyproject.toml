[project]
name = "app"
version = "0.1.0"
description = "Plataforma Educacional Inclusiva SINA_IA"
authors = [
    {name = "Nicholas", email = "nicholasnas.nn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1)",
    "pillow (>=12.3.0,<13.0.0)",
    "edge-tts (>=7.2.8,<8.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "google-genai (>=0.1.1)",
    "aiofiles (>=23.2.1)",
    "asyncpg (>=0.30.0)",
    "alembic (>=1.14.0)",
    "psycopg2-binary (>=2.9.10)",
    "argon2-cffi (>=23.1.0)",
    "pyjwt (>=2.9.0)",
    "slowapi (>=0.1.9)",
    "cryptography (>=50.0.1,<51.0.0)",
    "openai (>=3.19.0,<4.0.0)",
    "lameenc (>=1.8,<2.0)",
    "httpx (>=0.27.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0.0)",
    "pytest-asyncio (>=0.23.0)",
    "httpx (>=0.27.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "poethepoet (>=0.32.0)",
    "typos (>=1.50.0,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["app", "."]
addopts = "-p no:warnings --cov=app --cov-context=test"
markers = [
    "live: testes que chamam APIs externas reais",
    "e2e: testes de ponta a ponta",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['PLR', 'PLW0717', 'E501']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.typos.files]
extend-exclude = [
    "*.md",
    "app/services/accessibility_prompts.py",
    "fixtures/exercicios.json",
]

[tool.typos.default.extend-words]
responde = "responde"
Responde = "Responde"
denominador = "denominador"
numerador = "numerador"
cliente = "cliente"
Formate = "Formate"
Gere = "Gere"
Erro = "Erro"
Converte = "Converte"
Considere = "Considere"
fundamentais = "fundamentais"
diagramas = "diagramas"
exponencial = "exponencial"
ser = "ser"
frase = "frase"
termo = "termo"
processos = "processos"
protocolos = "protocolos"
clientes = "clientes"
educacional = "educacional"
operacional = "operacional"
atual = "atual"
inicial = "inicial"
erros = "erros"
selectin = "selectin"
corporativo = "corporativo"
caracteres = "caracteres"
controle = "controle"
credencial = "credencial"
limite = "limite"
algoritmos = "algoritmos"
falso = "falso"
Falso = "Falso"
momento = "momento"
professores = "professores"
problemas = "problemas"
PROBLEMAS = "PROBLEMAS"
itens = "itens"
relevante = "relevante"
excede = "excede"

[tool.poe]
poetry_command = ""

[tool.poe.tasks]
lint.sequence = [
  { cmd = "typos" },
  { cmd = "ruff check" },
]
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
serve = "PYTHONPATH=app poetry run uvicorn app.main:app --reload"
test.sequence = [
  "lint",
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]
