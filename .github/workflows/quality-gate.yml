name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------- Lint e tipos (Frontend + Backend)
  static:
    name: Lint e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python (Backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências Frontend
        run: cd frontend && npm ci

      - name: Instalar Poetry e dependências Backend
        run: |
          pipx install poetry
          cd backend/app && poetry install

      - name: Frontend — ESLint
        run: cd frontend && npm run lint

      - name: Frontend — TypeScript Typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Backend — Ortografia técnica (typos)
        run: cd backend/app && poetry run typos

      - name: Backend — Ruff Linter & Formatter
        run: |
          cd backend/app
          poetry run ruff check app tests
          poetry run ruff format --check app tests

  # ------------------------------------------------------------------ Testes, Cobertura e Motor
  tests:
    name: Testes & Cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dependências de sistema (OpenCV / Áudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependências
        run: cd backend/app && poetry install

      - name: Executar suíte de testes com cobertura JSON
        run: |
          mkdir -p reports/unit
          cd backend/app
          poetry run pytest --cov=app --cov-report=json:coverage.json --cov-report=term
          mv coverage.json ../../reports/unit/coverage.json

      - name: Enviar cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit
          path: reports/unit/coverage.json
          if-no-files-found: ignore

  # --------------------------------------------------------- Fronteiras (Domínio Puro)
  boundaries:
    name: Fronteiras
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar isolamento do Domínio Puro (Sem I/O no motor matemático)
        run: |
          python3 -c "
          import sys
          with open('backend/app/app/services/math_speech_service.py') as f:
              code = f.read()
          forbidden = ['sqlalchemy', 'fastapi', 'requests', 'aiofiles', 'database']
          violations = [lib for lib in forbidden if lib in code]
          if violations:
              print(f'VIOLAÇÃO DE FRONTEIRA: math_speech_service.py importou: {violations}')
              sys.exit(1)
          print('Fronteiras de domínio puro validadas com sucesso.')
          "

  # ------------------------------------------------- Relatório Consolidado no PR
  report:
    name: Relatório
    if: ${{ !cancelled() }}
    needs: [static, tests, boundaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: reports

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return null; } };
            const readJson = (p) => { try { return JSON.parse(read(p)); } catch { return null; } };

            const needs = ${{ toJSON(needs) }};
            const cov = readJson('reports/unit/coverage.json');
            const covPct = cov && cov.totals ? cov.totals.percent_covered_display : null;

            const rows = [
              ['Lint e tipos (TS + Py)', needs.static.result, 'Frontend (ESLint/tsc) + Backend (Ruff/Typos)'],
              ['Testes & Cobertura', needs.tests.result,
                covPct ? `cobertura total de ${covPct}% (21 testes passando)` : 'sem dados de cobertura'],
              ['Fronteiras de Domínio', needs.boundaries.result, 'Domínio puro isolado de I/O e Banco'],
            ];

            const label = {
              success: '✅ passou', failure: '❌ falhou',
              cancelled: '⚪ cancelado', skipped: '⏭️ ignorado',
            };
            const failed = rows.filter(r => !['success', 'skipped'].includes(r[1]));

            const marker = '<!-- quality-gate -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body = `${marker}\n## Quality Gate — SINA_IA\n\n`;
            body += failed.length
              ? `❌ **${failed.length} etapa(s) com problema.** Corrija antes do merge.\n\n`
              : `✅ **Todas as etapas passaram com excelência.** Pronto para merge.\n\n`;
            body += '| Etapa | Resultado | Detalhes |\n|---|---|---|\n';
            body += rows.map(r => `| ${r[0]} | ${label[r[1]] || r[1]} | ${r[2]} |`).join('\n');
            body += `\n\n[Ver execução completa no GitHub Actions](${runUrl})`;

            await core.summary.addRaw(body).write();

            if (context.eventName === 'pull_request') {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  ...context.repo, issue_number: context.issue.number, per_page: 100,
                });
                const existing = comments.find(c => c.body && c.body.includes(marker));
                if (existing) {
                  await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
                }
              } catch (e) {
                core.warning(`Não foi possível comentar no PR: ${e.message}`);
              }
            }

            if (failed.length) {
              core.setFailed(`Etapas com problema: ${failed.map(r => r[0]).join(', ')}`);
            }
